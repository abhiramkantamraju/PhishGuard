[pytest]
# Tests live in tests/ while the modules they import (app.py, the phishguard
# package, the CLI scripts) sit at the repository root. `pythonpath = .` puts the
# root on sys.path so `import app` and `from phishguard import ...` resolve from
# inside tests/ without needing an installed distribution or a sys.path hack in
# a conftest.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    # Flask-Limiter warns on every app creation that in-memory storage is not
    # for production. That is a deliberate choice for this single-process demo
    # app (documented in app.py and the README), not something to fix in tests.
    ignore:Using the in-memory storage for tracking rate limits:UserWarning
